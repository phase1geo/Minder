app-id: io.github.phase1geo.minder
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
base: io.elementary.BaseApp
base-version: tanit-26.08
command: io.github.phase1geo.minder
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: libmarkdown
    buildsystem: simple
    build-commands:
      - ./configure.sh --shared --prefix=/app --pkg-config
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - sed -e 's|/sbin/ldconfig|/sbin/ldconfig -n|' -i librarian.sh
      - make install
    sources:
      - type: archive
        url: https://github.com/Orc/discount/archive/refs/tags/v2.2.4.tar.gz
        sha256: 918905377e6ed3d0a7158cac0a4a18ed3c4cc0cad8ee95dddd82cb86ba9dd044

  - name: lasem
    buildsystem: meson
    config-opts:
      - -Dintrospection=disabled
      - -Dviewer=disabled
      - -Ddocumentation=disabled
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/LasemProject/lasem/archive/refs/tags/0.6.0.tar.gz
        sha256: e3e2398d83b01c0790776f052c919c38d05af4a339ef1366b23ede741684ad59

  - name: minder
    buildsystem: meson
    sources:
      - type: dir
        path: ..
