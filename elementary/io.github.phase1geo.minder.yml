app-id: io.github.phase1geo.minder
runtime: io.elementary.Platform
runtime-version: '9.1'
sdk: io.elementary.Sdk
command: io.github.phase1geo.minder
finish-args:
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=wayland'
modules:
  - name: libmarkdown
    buildsystem: simple
    build-commands:
      - ./configure.sh --shared --prefix=/app --pkg-config
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - sed -e 's|/sbin/ldconfig|/sbin/ldconfig -n|' -i librarian.sh
      - make install
    sources:
      - type: archive
        url: https://github.com/Orc/discount/archive/refs/tags/v2.2.4.tar.gz
        sha256: 918905377e6ed3d0a7158cac0a4a18ed3c4cc0cad8ee95dddd82cb86ba9dd044

  - name: gtksourceview
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/GNOME/gtksourceview.git
        tag: '5.12.0'

  - name: lasem
    buildsystem: meson
    config-opts:
      - -Dintrospection=disabled
      - -Dviewer=disabled
      - -Ddocumentation=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/LasemProject/lasem.git
        commit: e657038b7f348a91fabd06da192aedef137bd2f2

  - name: minder
    buildsystem: meson
    sources:
      - type: dir
        path: ..
